<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>受領書</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1f3a5f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:sans-serif;margin:16px}
button,label.btn{display:block;width:100%;padding:14px;margin:8px 0;font-size:18px;text-align:center;background:#1976d2;color:#fff;border:none;border-radius:8px;box-sizing:border-box}
label.btn{padding:8px;font-size:15px;width:60%;margin:8px auto}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;margin:0 0 8px;background:#ddd;color:#333}
.tabs button.on{background:#1f3a5f;color:#fff}
input[type=text],textarea{width:100%;padding:12px;font-size:18px;box-sizing:border-box;border:1px solid #999;border-radius:8px}
#photos img{width:30%;margin:1%;border:1px solid #ccc}
#sig{border:2px solid #333;width:100%;height:200px;touch-action:none;background:#fff;box-sizing:border-box;display:block}
@media (orientation:landscape){#sig{height:70vh}}
details{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin-bottom:12px}
summary{font-size:16px;font-weight:bold}
#sealPrev{max-width:120px;max-height:120px;display:block;margin:8px auto}
</style>
</head>
<body>
<div class="tabs">
  <button id="tabJ" onclick="setMode('juryo')">受領書</button>
  <button id="tabA" onclick="setMode('azukari')">預かり証</button>
</div>
<h2 id="title">受領書</h2>
<details id="setBox" hidden>
<summary>事務所名・職印の画像</summary>
<p>事務所名と職印が入ったPNG画像を選んでください。PDFの右上にそのまま入ります。</p>
<textarea id="myname" hidden rows="3" placeholder="例）〇〇事務所&#10;担当　〇〇"></textarea>
<label class="btn">画像を選ぶ（PNG）
  <input type="file" accept="image/png,image/*" id="sealCam" hidden>
</label>
<small style="color:#666">※一度選べばスマホの中に残るので、次回からは不要です</small>
<img id="sealPrev" hidden>
</details>
<input type="text" id="karte" placeholder="案件カルテ番号を入力">
<label class="btn">書類を撮影
  <input type="file" accept="image/*" capture="environment" id="cam" hidden>
</label>
<div id="photos"></div>
<small style="color:#666">※写真をタップすると削除できます</small>
<div id="sigArea">
  <p>上記の書類を受け取りました。</p>
  <canvas id="sig"></canvas>
  <button onclick="clearSig()" style="background:#777">サインを消す</button>
</div>
<button onclick="savePdf()">PDFで保存</button>
<script>
const $=id=>document.getElementById(id);
const photos=[];let seal=null,mode='juryo',pendingSig=null;

// ---- スマホ内（IndexedDB）への保存。ネットには送りません ----
function db(){return new Promise((ok,ng)=>{const q=indexedDB.open('juryo',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error);});}
async function put(k,v){const d=await db();return new Promise(ok=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=ok;});}
async function get(k){const d=await db();return new Promise(ok=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>ok(q.result);});}
function sigData(){return (cv.width&&cv.height)?cv.toDataURL('image/png'):pendingSig;}
function saveState(){put('state',{karte:$('karte').value,photos:photos.map(p=>p.src),sig:sigData()}).catch(()=>{});}
function saveSettings(){put('settings',{mode,name:$('myname').value,seal:seal?seal.src:null}).catch(()=>{});}
function loadImg(src){return new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=src;});}
function readFile(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f);});}

// ---- 受領書／預かり証の切り替え ----
function setMode(m){
  mode=m;
  $('tabJ').classList.toggle('on',m==='juryo');
  $('tabA').classList.toggle('on',m==='azukari');
  $('title').textContent=m==='juryo'?'受領書':'預かり証';
  document.title=$('title').textContent;
  $('sigArea').hidden=m!=='juryo';
  $('setBox').hidden=m!=='azukari';
  if(m==='azukari'&&!seal)$('setBox').open=true;
  if(m==='juryo')refit();
  saveSettings();
}

// ---- 書類の写真 ----
function addPreview(img){
  const t=document.createElement('img');t.src=img.src;
  t.onclick=()=>{
    if(!confirm('この写真を消しますか？'))return;
    const i=photos.indexOf(img);if(i>=0)photos.splice(i,1);
    t.remove();saveState();
  };
  $('photos').appendChild(t);
}
$('cam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const img=await loadImg(await readFile(f));
  photos.push(img);addPreview(img);saveState();
};
$('karte').addEventListener('input',saveState);
$('myname').addEventListener('input',saveSettings);

// ---- サイン欄（受領書） ----
const cv=$('sig'),ctx=cv.getContext('2d');
function fit(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;ctx.lineWidth=3;ctx.lineCap='round';}
function drawFit(src){const s=Math.min(cv.width/src.width,cv.height/src.height);const w=src.width*s,h=src.height*s;ctx.drawImage(src,(cv.width-w)/2,(cv.height-h)/2,w,h);}
function refit(){
  let old=null;
  if(cv.width&&cv.height){old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;old.getContext('2d').drawImage(cv,0,0);}
  fit();
  if(!cv.width||!cv.height)return;
  if(old)drawFit(old);
  else if(pendingSig){const p=pendingSig;pendingSig=null;loadImg(p).then(drawFit);}
}
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(mode==='juryo')refit();},200);});
let drawing=false;
const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
cv.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));};
cv.onpointermove=e=>{if(drawing){ctx.lineTo(...pos(e));ctx.stroke();}};
cv.onpointerup=cv.onpointerleave=()=>{if(drawing){drawing=false;saveState();}};
function clearSig(){ctx.clearRect(0,0,cv.width,cv.height);pendingSig=null;saveState();}

// ---- 職印（預かり証）：朱色だけ残して背景を透明にし、余白を切り取る ----
$('sealCam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const src=await loadImg(await readFile(f));
  {// PNG画像をそのまま取り込む（大きすぎる場合だけ縮小）
    const r=Math.min(1,1200/Math.max(src.width,src.height));
    const c2=document.createElement('canvas');c2.width=Math.round(src.width*r);c2.height=Math.round(src.height*r);
    c2.getContext('2d').drawImage(src,0,0,c2.width,c2.height);
    seal=await loadImg(c2.toDataURL('image/png'));
    $('sealPrev').src=seal.src;$('sealPrev').hidden=false;saveSettings();return;
  }
  const s=Math.min(1,800/Math.max(src.width,src.height));
  const c=document.createElement('canvas');c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);
  const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),p=d.data;
  let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let i=0;i<p.length;i+=4){
    const red=p[i]-Math.max(p[i+1],p[i+2]);
    if(red<40){p[i+3]=0;continue;}
    p[i]=200;p[i+1]=30;p[i+2]=30;p[i+3]=Math.min(255,red*3);
    const x=(i/4)%c.width,y=Math.floor(i/4/c.width);
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
  }
  if(x1<0){alert('職印がうまく読み取れませんでした。明るい場所で撮り直してください');return;}
  g.putImageData(d,0,0);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  seal=await loadImg(o.toDataURL('image/png'));
  $('sealPrev').src=seal.src;$('sealPrev').hidden=false;saveSettings();
};

// ---- 起動時に前回の状態を復元 ----
(async()=>{
  let st=null;
  try{
    st=await get('settings');
    if(st){
      $('myname').value=st.name||'';
      if(st.seal){seal=await loadImg(st.seal);$('sealPrev').src=seal.src;$('sealPrev').hidden=false;}
    }
    const s=await get('state');
    if(s){
      $('karte').value=s.karte||'';
      for(const src of s.photos||[]){const img=await loadImg(src);photos.push(img);addPreview(img);}
      if(s.sig&&s.sig.length>30)pendingSig=s.sig;
    }
  }catch(e){}
  setMode(st&&st.mode==='azukari'?'azukari':'juryo');
})();
function resetAll(){photos.length=0;$('photos').innerHTML='';$('karte').value='';ctx.clearRect(0,0,cv.width,cv.height);pendingSig=null;put('state',null).catch(()=>{});}

// ---- PDF作成 ----
function savePdf(){
  if(!photos.length){alert('書類を撮影してください');return;}
  const J=mode==='juryo';
  if(!J&&!seal){if(!confirm('事務所名・職印の画像が未設定です。このまま作成しますか？'))return;}
  const W=1240,H=1754,M=90,NAVY='#1f3a5f',GRAY='#666',SC=3;
  const FONT='"Noto Serif JP","Yu Mincho",serif';
  const pg=document.createElement('canvas');pg.width=W*SC;pg.height=H*SC;
  const g=pg.getContext('2d');g.scale(SC,SC);g.imageSmoothingQuality='high';
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  // 外枠（二重線）
  g.strokeStyle=NAVY;g.lineWidth=4;g.strokeRect(40,40,W-80,H-80);
  g.lineWidth=1;g.strokeRect(52,52,W-104,H-104);
  const now=new Date(),pad=n=>String(n).padStart(2,'0');
  const no=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes());
  const jd=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+pad(now.getHours())+':'+pad(now.getMinutes());
  const karte='案件カルテ番号：'+($('karte').value||'未入力');
  let titleY,bodyY,labelY,top,areaH;
  g.fillStyle=GRAY;g.font='22px '+FONT;
  if(J){
    // 右上：カルテ番号と日付
    g.textAlign='right';g.fillText(karte,W-M,110);g.fillText(jd,W-M,142);
    titleY=215;bodyY=300;labelY=355;top=372;areaH=1110;
  }else{
    // 左上：カルテ番号と日付／右上：名前と職印
    g.textAlign='left';g.fillText(karte,M,110);g.fillText(jd,M,142);
    const lines=$('myname').value.split('\n').filter(s=>s.trim());
    g.fillStyle='#222';g.textAlign='right';g.font='26px '+FONT;
    lines.forEach((s,i)=>g.fillText(s,W-M-50,120+i*38));
    if(seal){
      const k=Math.min(440/seal.width,170/seal.height);
      const w=seal.width*k,h=seal.height*k;
      const cy=120+Math.max(0,lines.length-1)*38-9;
      g.drawImage(seal,W-M-w,75,w,h);
    }
    titleY=270;bodyY=355;labelY=410;top=428;areaH=H-160-428;
  }
  // タイトル
  g.fillStyle=NAVY;g.textAlign='center';g.font='bold 52px '+FONT;
  g.fillText(J?'受　領　書':'預　か　り　証',W/2,titleY);
  const lw=J?150:170;
  g.fillRect(W/2-lw,titleY+20,lw*2,3);g.fillRect(W/2-lw,titleY+28,lw*2,1.5);
  // 本文
  g.fillStyle='#222';g.font='26px '+FONT;
  g.fillText(J?'下記の書類を確かに受領いたしました。':'下記の書類を確かにお預かりいたしました。',W/2,bodyY);
  // 写真エリア（横並び・最大3列）
  g.textAlign='left';g.fillStyle=NAVY;g.font='bold 24px '+FONT;
  g.fillText((J?'■ 受領書類（':'■ お預かり書類（')+photos.length+'点）',M,labelY);
  const gap=18,inner=16;
  g.fillStyle='#f5f7fa';g.fillRect(M,top,W-2*M,areaH);
  const n=photos.length,cols=Math.min(n,3),rows=Math.ceil(n/cols);
  const aw=W-2*M-2*inner,ah=areaH-2*inner;
  const cw=(aw-gap*(cols-1))/cols,ch=(ah-gap*(rows-1))/rows-28;
  const slots=[];
  photos.forEach((img,i)=>{
    const c=i%cols,r=Math.floor(i/cols);
    const s=Math.min(cw/img.width,ch/img.height);
    const w=img.width*s,h=img.height*s;
    const cx=M+inner+c*(cw+gap),cy=top+inner+r*(ch+28+gap);
    const x=cx+(cw-w)/2,y=cy+(ch-h)/2;
    g.shadowColor='rgba(0,0,0,0.25)';g.shadowBlur=8;g.shadowOffsetY=3;
    g.fillStyle='#fff';g.fillRect(x-5,y-5,w+10,h+10);
    g.shadowColor='transparent';
    slots.push({img,x,y,w,h});
    g.fillStyle=GRAY;g.textAlign='center';g.font='20px '+FONT;
    g.fillText('書類 '+(i+1),cx+cw/2,cy+ch+24);
    g.textAlign='left';
  });
  if(J){
    // 署名欄（小さめ）
    const sy=1530;
    g.fillStyle=NAVY;g.font='bold 24px '+FONT;
    g.fillText('■ 受領者署名',M,sy);
    const sh=120,sw=(cv.width&&cv.height)?Math.min(520,sh*cv.width/cv.height):520;
    if(cv.width&&cv.height)g.drawImage(cv,M,sy+12,sw,sh);
    g.strokeStyle='#333';g.lineWidth=2;
    g.beginPath();g.moveTo(M,sy+12+sh);g.lineTo(M+520,sy+12+sh);g.stroke();
    g.fillStyle=GRAY;g.font='20px '+FONT;g.textAlign='right';
    g.fillText('受領日時：'+jd,W-M,sy+12+sh);
  }else{
    g.fillStyle=GRAY;g.font='22px '+FONT;g.textAlign='right';
    g.fillText('お預かり日時：'+jd,W-M,H-110);
  }
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({format:'a4'});
  pdf.addImage(pg.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
  // 写真は高画質のまま直接貼る（1枚あたり約1MB）
  const k=210/W;
  slots.forEach(s=>{
    const L=2400,r=Math.min(1,L/Math.max(s.img.width,s.img.height));
    const t=document.createElement('canvas');
    t.width=Math.round(s.img.width*r);t.height=Math.round(s.img.height*r);
    const tg=t.getContext('2d');tg.imageSmoothingQuality='high';
    tg.drawImage(s.img,0,0,t.width,t.height);
    pdf.addImage(t.toDataURL('image/jpeg',0.85),'JPEG',s.x*k,s.y*k,s.w*k,s.h*k);
  });
  pdf.save((J?'受領書_':'預かり証_')+no+'.pdf');
  resetAll();
}
</script>
</body>
</html>
